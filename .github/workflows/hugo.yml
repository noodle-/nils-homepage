# Build the Hugo site; deploy it to GitHub Pages from main.
#
# Pull requests build but do not deploy, so a broken template is caught before
# it reaches the live site rather than by a failed deploy afterwards.
name: Deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  # The timeline's "present" bar is measured against the build date, so a site
  # that is never rebuilt slowly falls behind. Rebuild on the 1st of the month.
  schedule:
    - cron: "0 5 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      HUGO_ENVIRONMENT: production
      TZ: Europe/Oslo
    steps:
      - name: Install Hugo CLI
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive   # pulls in the PaperMod theme

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # --panicOnWarning turns Hugo's deprecation warnings into build failures.
      # The two files in layouts/ that shim removed template methods exist
      # because of exactly those warnings — this is what tells us when a theme
      # bump has made them redundant, or introduced new ones.
      - name: Build with Hugo
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          hugo \
            --gc \
            --minify \
            --panicOnWarning \
            --baseURL "${BASE_URL}/"

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
