# ---------------------------------------------------------------------------
# nils-homepage — single-page CV. Edit data/cv.yaml to change the timeline.
# ---------------------------------------------------------------------------

baseURL = "https://noodle-.github.io/nils-homepage/"
locale = "en-US"          # RFC 5646 casing — feeds og:locale as "en_US"
title = "Nils"
theme = "PaperMod"

enableRobotsTXT = true

# One page, no taxonomies, no feed. Keeps /tags/ and /categories/ out of the
# sitemap and stops an empty index.xml being advertised in <head>.
disableKinds = ["taxonomy", "term", "RSS"]

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "Nils"
  description = "CV of Nils — software test & automation engineer."
  DateFormat = "2 January 2006"

  # Link-preview card. PaperMod's get-page-images falls back to this, which
  # gets us og:image and twitter:image, and upgrades twitter:card from
  # "summary" to "summary_large_image". Regenerate with tools\make-images.ps1.
  images = ["og-card.png"]
  # One theme, no toggle. With defaultTheme = "light" PaperMod also drops its
  # inline theme-switch script and its prefers-color-scheme <noscript> block,
  # so the page renders identically with or without JS. Palette lives in
  # assets/css/extended/custom.css.
  defaultTheme = "light"
  disableThemeToggle = true

  tagline = "Software test & automation engineer"
  cvIntro = ""

  hideFooter = false

  [params.assets]
    disableFingerprinting = false
    favicon = "favicon.ico"
    favicon16x16 = "favicon-16x16.png"
    favicon32x32 = "favicon-32x32.png"
    apple_touch_icon = "apple-touch-icon.png"
    safari_pinned_tab = "safari-pinned-tab.svg"
    theme_color = "#0d9488"
    msapplication_TileColor = "#0d9488"

  # Rendered as text links at the bottom of the CV, and as schema.org sameAs.
  #
  # `name` is the visible label, not a PaperMod icon key: layouts/index.html
  # renders these as text rather than calling the theme's social_icons partial,
  # so brand casing is safe here and cannot break an icon lookup.
  #
  # No email entry on purpose. A mailto on a public page gets harvested, and
  # the dedicated address for this is not set up yet — GitHub and LinkedIn are
  # the contact routes until it is. schema_json.html derives its `email` field
  # from a mailto: entry here, so omitting one drops the address from the
  # structured data too, rather than publishing one that does not work.
  [[params.socialIcons]]
    name = "GitHub"
    url = "https://github.com/noodle-"
  [[params.socialIcons]]
    name = "LinkedIn"
    url = "https://www.linkedin.com/in/nils-b%C3%BCnger/"

# No nav menu — it's a one-pager.
