# ---------------------------------------------------------------------------
# nils-homepage — Hugo + PaperMod configuration
# ---------------------------------------------------------------------------

baseURL = "https://noodle-.github.io/nils-homepage/"
locale = "en-us"
title = "Nils"
theme = "PaperMod"

enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true

[minify]
  disableXML = true
  minifyOutput = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[params]
  env = "production"
  author = "Nils"
  description = "Personal site of Nils — test & release engineering and film photography."
  keywords = ["testing", "release engineering", "blog", "portfolio", "film photography"]
  DateFormat = "2 January 2006"
  defaultTheme = "auto"
  disableThemeToggle = false

  ShowReadingTime = true
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = false
  ShowToc = true
  TocOpen = false
  ShowRssButtonInSectionTermList = true

  [params.profileMode]
    enabled = true
    title = "Nils"
    subtitle = "Test &amp; release engineer. Shoots film."
    imageUrl = "images/avatar.jpg"
    imageWidth = 120
    imageHeight = 120
    imageTitle = "Nils"

    [[params.profileMode.buttons]]
      name = "Posts"
      url = "posts"
    [[params.profileMode.buttons]]
      name = "About"
      url = "about"
    [[params.profileMode.buttons]]
      name = "Uses"
      url = "uses"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/noodle-"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:you@example.com"   # set your address or delete this block
  [[params.socialIcons]]
    name = "rss"
    url = "index.xml"

  [params.assets]
    disableHLJS = false
    favicon = "favicon.ico"

[[menu.main]]
  identifier = "posts"
  name = "Posts"
  url = "/posts/"
  weight = 10
[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 20
[[menu.main]]
  identifier = "uses"
  name = "Uses"
  url = "/uses/"
  weight = 30
[[menu.main]]
  identifier = "now"
  name = "Now"
  url = "/now/"
  weight = 40
[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 50
[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 60
