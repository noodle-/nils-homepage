# ---------------------------------------------------------------------------
# nils-homepage — single-page CV. Edit data/cv.yaml to change the timeline.
# ---------------------------------------------------------------------------

baseURL = "https://noodle-.github.io/nils-homepage/"
locale = "en-us"
title = "Nils"
theme = "PaperMod"

enableRobotsTXT = true
enableEmoji = true
pygmentsUseClasses = true

[minify]
  disableXML = true
  minifyOutput = true

[params]
  env = "production"
  author = "Nils"
  description = "CV of Nils — software test & automation engineer."
  DateFormat = "2 January 2006"
  defaultTheme = "auto"
  disableThemeToggle = false

  tagline = "Software test & automation engineer"
  cvIntro = ""

  ShowBreadCrumbs = false
  ShowReadingTime = false
  ShowPostNavLinks = false
  hideFooter = false

  [params.assets]
    disableHLJS = true
    disableFingerprinting = false
    favicon = "favicon.ico"

  # Shown as text links at the bottom of the CV.
  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/noodle-"
  [[params.socialIcons]]
    name = "email"
    url = "mailto:you@example.com"

# No nav menu — it's a one-pager.
